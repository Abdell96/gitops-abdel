apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-api-abdel
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdell96/gitops-abdel
    targetRevision: HEAD
    path: apps/todo-api-ab
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-api-abdel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
